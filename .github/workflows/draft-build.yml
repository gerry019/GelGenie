name: Draft build (every push to main)

# Fast feedback loop: builds the extension jar and runs tests on every push / PR to
# main, and uploads the jar as a downloadable artifact so you can grab a throwaway
# build without cutting a real release. This does NOT create a GitHub Release.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qupath-gelgenie
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # No -Pversion here: dev builds keep the fallback version from build.gradle.kts.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload extension jar (dev artifact, 7-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: qupath-extension-gelgenie-dev
          path: qupath-gelgenie/build/libs/qupath-extension-gelgenie-*.jar
          retention-days: 7
          if-no-files-found: error
